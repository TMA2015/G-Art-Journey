<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">Create depth in a pencil landscape</title><desc id="d">Three example scenes show eye level and converging lines, lighter distant mountains, and a more complete shaded street.</desc>
<defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f8f3ea"/><stop offset="1" stop-color="#eae3d8"/></linearGradient><pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="4" cy="8" r=".7" fill="#6a6159" opacity=".12"/><circle cx="20" cy="21" r=".5" fill="#6a6159" opacity=".14"/></pattern></defs><rect width="1600" height="1000" fill="url(#paper)"/><rect width="1600" height="1000" fill="url(#grain)"/>

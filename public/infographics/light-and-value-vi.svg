<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">Ánh sáng và sắc độ: bài chì</title><desc id="d">Quả cầu đánh chì, bóng đổ, năm ô sắc độ và sơ đồ hướng sáng.</desc>

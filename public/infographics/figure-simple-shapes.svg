<g font-family="Arial,sans-serif" font-size="18" fill="#73685f"><text x="111" y="798">One loose line can suggest a pose.</text><text x="608" y="798">A head, chest, hips and limbs.</text><text x="1106" y="798">Weight falls near the standing foot.</text></g>

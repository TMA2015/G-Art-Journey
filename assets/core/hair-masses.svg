<rect width="900" height="1200" fill="#f9f6ef"/>
<text x="52" y="60" class="title">Draw Hair as Masses, Then Strands</text>
<text x="54" y="94" class="sub">Build the silhouette and flow before drawing individual hairs.</text>
<text x="54" y="122" class="meta">G-Art Journey · Phase 2A · Core Drawing Skills</text>

<g>
  <rect x="30" y="165" width="158" height="390" rx="16" fill="#fff" stroke="#d7d0c6"/>
  <rect x="30" y="165" width="158" height="45" rx="16" fill="#b0d6c3"/><rect x="30" y="193" width="158" height="17" fill="#b0d6c3"/>
  <text x="43" y="193" class="step">1  Head volume</text>

  <rect x="200" y="165" width="158" height="390" rx="16" fill="#fff" stroke="#d7d0c6"/>
  <rect x="200" y="165" width="158" height="45" rx="16" fill="#efc092"/><rect x="200" y="193" width="158" height="17" fill="#efc092"/>

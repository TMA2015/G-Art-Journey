  <use href="#hairSilhouette"/>
  <use href="#lockGroups"/>
  <use href="#selectedStrands"/>
</g>
<text x="726" y="518" class="small">few strands, clear forms</text>

<text x="45" y="600" class="step" fill="#1e3f67">Quick studies</text>

<g>

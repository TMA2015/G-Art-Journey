  <rect x="710" y="165" width="158" height="45" rx="16" fill="#b0d6c3"/><rect x="710" y="193" width="158" height="17" fill="#b0d6c3"/>
  <text x="723" y="193" class="step">5  Selected strands</text>
</g>

<g fill="#1e3f67">
  <path d="M190 356h8l-5-5 4-4 12 12-12 12-4-4 5-5h-8z"/>

<rect x="40" y="895" width="820" height="190" rx="20" fill="#fff" stroke="#d7d0c6"/>
<text x="65" y="930" class="step" fill="#1e3f67">Practice tip</text>
<text x="65" y="962" class="sub" style="font-size:16px">Squint at your reference. If the big hair shape disappears, detail came too soon.</text>
<text x="65" y="1000" class="mini">Full-resolution QA</text>
<text x="65" y="1028" class="small">• Keep the same head, hairstyle and viewpoint through all five stages.</text>
<text x="65" y="1055" class="small">• Make flow, grouped locks and front/back overlap clear before small strands.</text>
<text x="42" y="1150" class="step" fill="#1e3f67">Silhouette first · Flow second · Strands last</text>

<text x="65" y="952" class="sub" style="font-size:16px">Compare your drawing with your own hand from the same angle.</text>
<text x="65" y="990" class="mini">Full-resolution QA</text>
<text x="65" y="1018" class="small">• Every fully visible hand has exactly five digits, including one correctly placed thumb.</text>
<text x="65" y="1045" class="small">• Keep the same hand orientation through the cumulative construction.</text>
